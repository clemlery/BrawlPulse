services:
  bot:
    build: 
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - server
    env_file:
      - ./bot/.env
  db:
    image: postgres:18
    restart: always
    env_file:
      - .env
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 40s
    networks:
      - backend
    ports:
        - "5432:5432"
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - backend
    env_file:
      - .env
    healthcheck:
      # CMD-SHELL so the container's shell expands API_PORT (CMD does no expansion).
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:$${API_PORT}/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgresql_data:

networks:
  backend:
    driver: bridge
    name: backend
