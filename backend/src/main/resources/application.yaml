ktor:
  application:
    modules:
      - com.brawlpulse.api.ApplicationKt.module
  deployment:
    port: ${API_PORT}
    host: ${API_HOST}
    scheme: ${API_SCHEME}

    # Configuration Netty pour éviter les timeouts
    runningLimit: 10
    responseWriteTimeoutSeconds: 60
    requestReadTimeoutSeconds: 60

    # Configuration des thread pools Netty
    connectionGroupSize: 2
    workerGroupSize: 5
    callGroupSize: 10

jwt:
  domain: "https://jwt-provider-domain/"
  audience: "jwt-audience"
  realm: "ktor sample app"
db:
  # Defaults to the docker compose "db" service. Override DB_JDBC_URL to run
  # the backend outside Docker, e.g. jdbc:postgresql://localhost:5432/brawlpulse
  jdbcUrl: "${DB_JDBC_URL:jdbc:postgresql://db:5432/brawlpulse}"
  driver: "org.postgresql.Driver"
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  maximumPoolSize: 5
